(() => {

      const el=document.createElement('div'); el.className='media-placeholder'; box.append(el);
    }
    return box;
  }
  function syncVideos(slide){
    const videos=[...slide.querySelectorAll('video')]; if(!videos.length)return;

  }

  }
  function scale(){if(exporting)return;const vp=document.querySelector('#viewport'),style=getComputedStyle(vp),availableWidth=vp.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),availableHeight=vp.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom),s=Math.min(availableWidth/dw,availableHeight/dh);frame.style.transform=`scale(${s})`}

  document.querySelector('#prev').onclick=()=>go(index-1); document.querySelector('#next').onclick=()=>go(index+1);
